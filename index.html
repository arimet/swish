<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The browser bar follows the page, not the accent: it is the continuation of
         the background, and a pink band above a light application reads as a bug.
         Both themes are declared, light first. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#c3cbd6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07090c" />
    <!-- The title says what the product *is* — a team's hub — and not what it
         displays. "Match sheet" named one screen out of nine, while the product's
         positioning is elsewhere: a team, its season, its data. This title serves as
         the tab, the installed application's name and the shared link preview; it is
         the same as the manifest's `name`, in vite.config.ts. -->
    <title>Swish — Le hub de votre équipe de basket</title>
    <!-- The theme is set before the first paint, and it has to be here: the light
         tokens live on bare `:root`, so a device set to dark would have seen a white
         flash while React mounted. Saved choice first, system preference second. The
         same pair of keys is read back by `ui/theme/ThemeProvider.tsx` — if it
         changes, it changes in both places. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('swish-theme')
          if (t !== 'light' && t !== 'dark') t = 'dark'
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.classList.toggle('dark', t === 'dark')
          // And the language, for the same reason: `lang` decides hyphenation,
          // quotation marks and a screen reader's voice. The document was born
          // `lang="en"` while all its content was French.
          var l = localStorage.getItem('swish-lang')
          document.documentElement.lang = (l === 'fr' || l === 'en') ? l : 'fr'
        } catch (e) { /* private browsing: the default light theme will do */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
