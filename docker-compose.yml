# The local development Postgres. In production it is Neon — same driver, same
# protocol, same code.
#
#   docker compose up -d
#   pnpm db:reset
#
# Then, in a `.env` (see `.env.example`):
#   DATABASE_URL=postgres://swish:swish@localhost:5433/swish
#   WRITE_TOKEN=<any long random string>
#
# Without `DATABASE_URL` the application has nothing to read or write: the database
# is its only store.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: swish
      POSTGRES_PASSWORD: swish
      POSTGRES_DB: swish
    # 5433 and not 5432: a Postgres is often already installed on the machine, and the
    # port conflict would only show up on the first query.
    ports: ['5433:5432']
    volumes: ['swish-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swish -d swish']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  swish-db:
