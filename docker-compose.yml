# Le Postgres du développement local. En production, c'est Neon — même pilote,
# même protocole, même code.
#
#   docker compose up -d
#   psql "postgres://swish:swish@localhost:5433/swish" -f db/schema.sql
#
# Puis, dans un `.env` :
#   DATABASE_URL=postgres://swish:swish@localhost:5433/swish
#   SYNC_WRITE_TOKEN=dev
#   VITE_SYNC_URL=/api
#
# Sans ces variables, `pnpm dev` ignore tout ça et l'application reste 100 % locale.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: swish
      POSTGRES_PASSWORD: swish
      POSTGRES_DB: swish
    # 5433 et non 5432 : un Postgres est souvent déjà installé sur la machine, et
    # le conflit de port ne se manifesterait qu'à la première requête.
    ports: ['5433:5432']
    volumes: ['swish-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swish -d swish']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  swish-db:
