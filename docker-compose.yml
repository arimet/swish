# The local development Postgres. In production it is Neon — same driver, same
# protocol, same code.
#
#   docker compose up -d
#   psql "postgres://swish:swish@localhost:5433/swish" -f db/schema.sql
#
# Then, in a `.env`:
#   DATABASE_URL=postgres://swish:swish@localhost:5433/swish
#   SYNC_WRITE_TOKEN=dev
#   VITE_SYNC_URL=/api
#
# Without these variables, `pnpm dev` ignores all of it and the app stays 100% local.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: swish
      POSTGRES_PASSWORD: swish
      POSTGRES_DB: swish
    # 5433 and not 5432: a Postgres is often already installed on the machine, and the
    # port conflict would only show up on the first query.
    ports: ['5433:5432']
    volumes: ['swish-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swish -d swish']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  swish-db:
